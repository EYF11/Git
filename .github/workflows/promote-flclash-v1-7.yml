name: Promote FlClash v1.7

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/promote-flclash-v1-7.yml'

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update override to v1.7 and enable US geo check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('flclash/override.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('FlClash 中文完整版覆写 v1.6', 'FlClash 中文完整版覆写 v1.7', 1)
          s = s.replace('US_GEO_TEST_URL: "",', 'US_GEO_TEST_URL: "https://flclash-us-geo-check.shining-distance-c7e.workers.dev/us",', 1)
          s = s.replace('  // 真实美国出口检测端点（可选）。\n  // 要求：美国来源返回 HTTP 204，非美国返回非 204。\n  // 部署仓库中的 flclash/us-geo-check-worker.js 后，把 /us 地址填到这里。\n  // 留空时不会伪装成“真实美国检测”，而是使用下方候选组。', '  // 真实美国出口检测端点：美国来源返回 HTTP 204，非美国返回非 204。\n  // 已接入 Cloudflare Worker；用于自动剔除“节点名是美国、实际出口不是美国”的节点。')
          if 'FlClash 中文完整版覆写 v1.7' not in s:
              raise SystemExit('version update failed')
          if 'https://flclash-us-geo-check.shining-distance-c7e.workers.dev/us' not in s:
              raise SystemExit('geo URL update failed')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit update and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/promote-flclash-v1-7.yml
          git add flclash/override.js
          git commit -m 'Enable automatic US exit verification in FlClash v1.7'
          git push
